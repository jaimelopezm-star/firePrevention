# ============================================================================
# Configuración Nginx - Reverse Proxy para API IoT
# ============================================================================
# Descripción: Configuración del servidor virtual para la API IoT
# Función: Reverse proxy, rate limiting, security headers
# Ubicación en contenedor: /etc/nginx/conf.d/iot-api.conf
# Montado desde: ~/iot-platform/nginx/conf.d/iot-api.conf
# ============================================================================

# ============================================================================
# RATE LIMITING ZONES
# ============================================================================
# Zona para limitar peticiones generales de API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Zona para limitar peticiones de autenticación (más estricta)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ============================================================================
# UPSTREAM - Backend Flask API
# ============================================================================
upstream fastapi_backend {
    # Usar nombre de servicio Docker para resolución DNS automática
    # Docker Compose proporciona resolución DNS interna
    server fastapi:5000 fail_timeout=30s max_fails=3;
    
    # Configuración de keepalive para conexiones persistentes
    keepalive 32;
}

# ============================================================================
# SERVIDOR HTTP (Puerto 80)
# ============================================================================
server {
    # Escuchar en puerto 80 (IPv4 e IPv6)
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Nombre del servidor (usar dominio o IP del VPS)
    # _ = default catch-all
    server_name _;
    
    # Tamaño máximo del body de la request (10MB)
    client_max_body_size 10M;
    
    # ========================================================================
    # TIMEOUTS
    # ========================================================================
    client_body_timeout 12;      # Timeout para recibir body del cliente
    client_header_timeout 12;    # Timeout para recibir headers del cliente
    send_timeout 10;             # Timeout para enviar respuesta al cliente
    
    # ========================================================================
    # LOGS
    # ========================================================================
    access_log /var/log/nginx/iot-api-access.log combined;
    error_log /var/log/nginx/iot-api-error.log warn;
    
    # ========================================================================
    # SECURITY HEADERS
    # ========================================================================
    
    # Prevenir clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevenir MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Habilitar protección XSS del navegador
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Política de referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy (antes Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # TODO: Descomentar cuando se configure HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # ========================================================================
    # LOCATION: Root (/)
    # ========================================================================
    location / {
        # Rate limiting: 10 req/s con burst de 20
        limit_req zone=api_limit burst=20 nodelay;
        
        # ====================================================================
        # PROXY HEADERS
        # ====================================================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # ====================================================================
        # PROXY TIMEOUTS
        # ====================================================================
        proxy_connect_timeout 30s;   # Timeout para conectar al backend
        proxy_send_timeout 30s;      # Timeout para enviar request al backend
        proxy_read_timeout 30s;      # Timeout para leer respuesta del backend
        
        # ====================================================================
        # PROXY PASS
        # ====================================================================
        proxy_pass http://fastapi_backend;
        
        # Usar HTTP/1.1 para keepalive
        proxy_http_version 1.1;
        
        # Limpiar header Connection para keepalive
        proxy_set_header Connection "";
        
        # ====================================================================
        # BUFFERING
        # ====================================================================
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # ========================================================================
    # LOCATION: Health Checks (/health)
    # ========================================================================
    location ~ ^/health {
        # Sin rate limiting para health checks (monitoreo)
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_pass http://fastapi_backend;
        
        # Logs separados para health checks
        access_log /var/log/nginx/iot-api-health.log;
    }
    
    # ========================================================================
    # LOCATION: API Endpoints (/api/)
    # ========================================================================
    location /api/ {
        # Rate limiting más estricto para endpoints de API
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ========================================================================
    # BLOQUEO DE ACCESO A ARCHIVOS SENSIBLES
    # ========================================================================
    
    # Bloquear acceso a archivos ocultos (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Bloquear acceso a archivos de backup (~)
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # ========================================================================
    # NGINX STATUS (Solo red interna Docker)
    # ========================================================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.20.0.0/16;  # Solo red Docker interna
        deny all;
    }
}

